[project]
name = "verdescope"
version = "0.1.0"
description = "VerdeScope: deteccion de deficit de zonas verdes y propuesta de parques de bolsillo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "shapely>=2.0",
  "h3>=4.0",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "statsmodels>=0.14",
  "scipy>=1.12",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
stac = ["pystac-client", "planetary-computer"]
dl = ["torch"]

[project.scripts]
verdescope = "verdescope.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
