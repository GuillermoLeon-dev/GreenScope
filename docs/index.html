<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VerdeScope · Déficit de verde y parques de bolsillo</title>
  <meta name="description" content="VerdeScope detecta déficit de zonas verdes en Madrid y propone parques de bolsillo. El modelo propone; el técnico decide.">
  <meta name="theme-color" content="#0066FF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230066FF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./css/styles.css">
  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#sidebar">Saltar al panel</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>VerdeScope</h1>
        <p class="brand-sub">Déficit de verde y parques de bolsillo · Madrid</p>
      </div>
    </div>
    <div class="header-meta">
      <span class="badge badge-sample" id="sample-badge" hidden title="No se encontró ./data/; se muestran datos de ejemplo">Datos de ejemplo</span>
      <span class="badge" id="model-badge" title="Versión del modelo">modelo —</span>
      <span class="badge badge-plain" id="date-badge" title="Fecha de generación de los datos">—</span>
      <span class="company">Proyecto independiente</span>
    </div>
  </header>

  <main class="app-main">
    <section class="map-wrap" aria-label="Mapa de déficit de zonas verdes">
      <div id="map" class="map" role="application" aria-label="Mapa interactivo"></div>
      <div id="layer-control" class="map-overlay map-controls"></div>
      <div id="legend" class="map-overlay map-legend"></div>
      <div id="map-message" class="map-message" hidden></div>
    </section>

    <aside id="sidebar" class="sidebar" aria-label="Panel de control">
      <button type="button" id="sheet-handle" class="sheet-handle" aria-expanded="true" aria-controls="sidebar-body">
        <span class="sheet-grip" aria-hidden="true"></span>
        <span class="sheet-label">Panel</span>
      </button>
      <div id="sidebar-body" class="sidebar-body">
        <div class="sidebar-top">
          <p class="hitl-note"><strong>El modelo propone; el técnico decide.</strong> Los umbrales son tuyos: cada propuesta requiere tu aprobación.</p>
          <label class="field-inline" for="technician">
            <span>Técnico/a</span>
            <input type="text" id="technician" autocomplete="name" placeholder="Tu nombre" maxlength="80">
          </label>
        </div>

        <div class="tabs" role="tablist" aria-label="Secciones">
          <button role="tab" id="tab-btn-panel" aria-controls="tab-panel" data-tab="panel">Umbrales</button>
          <button role="tab" id="tab-btn-proposals" aria-controls="tab-proposals" data-tab="proposals">Propuestas <span class="count" id="pending-count" aria-label="pendientes"></span></button>
          <button role="tab" id="tab-btn-detail" aria-controls="tab-detail" data-tab="detail">Ficha</button>
          <button role="tab" id="tab-btn-data" aria-controls="tab-data" data-tab="data">Datos</button>
        </div>

        <section id="tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-panel">
          <div id="threshold-panel"></div>
          <div id="kpis"></div>
        </section>

        <section id="tab-proposals" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-proposals" hidden>
          <div id="proposal-list"></div>
        </section>

        <section id="tab-detail" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-detail" hidden>
          <div id="detail-empty" class="empty-state">Selecciona una celda o una propuesta en el mapa para ver su ficha.</div>
          <div id="cell-detail" hidden></div>
          <div id="proposal-detail" hidden></div>
        </section>

        <section id="tab-data" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-data" hidden>
          <div id="sources-panel"></div>
        </section>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">VerdeScope necesita JavaScript para mostrar el mapa.</p></noscript>
</body>
</html>
