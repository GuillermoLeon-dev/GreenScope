# Opción (b) de publicación: regenera datos del pipeline y PDFs y despliega docs/ en GitHub Pages.
# Requiere Settings → Pages → Source: "GitHub Actions". Con la opción (a) "Deploy from a branch /docs"
# no hace falta este workflow: docs/ ya contiene datos y PDFs versionados.
name: Pages (regenerar y desplegar)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        working-directory: backend
        run: uv run pytest -q
      - name: Pipeline ML (usa la caché OSM versionada)
        working-directory: backend
        run: uv run verdescope pipeline --offline
      - name: Documentación Typst → PDF
        working-directory: documentacion
        run: uv run --python 3.12 --with typst python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
